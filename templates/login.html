{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card card shadow-sm">
        <div class="card-body p-4 p-md-5">
            <h2 class="text-center mb-3">Secure Login</h2>
            <p class="text-center text-muted mb-4">Intelligent Login Security</p>

            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label for="identifier" class="form-label">Username or Email</label>
                    <input type="text" class="form-control" id="identifier" name="identifier" placeholder="Enter username or email" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>

            <div class="mt-3 text-center">
                <span class="text-muted">Need an account?</span>
                <a href="{{ url_for('register') }}" class="ms-1">Register here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
